name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir www
          cp index.html style.css script.js manifest.json sw.js icon-192.png icon-512.png www/

      - name: Create Android project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Speedometer com.speedometer.app --web-dir=www
          npx cap add android

      - name: Set app icon
        run: |
          pip install pillow
          test -f icon-512.png || (echo "icon-512.png is missing from the repo" && exit 1)
          python3 - <<'PY'
          from PIL import Image
          import glob, os
          src=Image.open('icon-512.png').convert('RGB')
          res='android/app/src/main/res'
          for f in glob.glob(res+'/mipmap-*/ic_launcher*'):
              os.remove(f)
          sizes={'mdpi':(48,108),'hdpi':(72,162),'xhdpi':(96,216),'xxhdpi':(144,324),'xxxhdpi':(192,432)}
          for d,(l,f) in sizes.items():
              p=res+'/mipmap-'+d
              os.makedirs(p,exist_ok=True)
              ic=src.resize((l,l),Image.LANCZOS)
              ic.save(p+'/ic_launcher.png')
              ic.save(p+'/ic_launcher_round.png')
              fg=Image.new('RGB',(f,f),(7,11,20))
              s=int(f*.66)
              fg.paste(src.resize((s,s),Image.LANCZOS),((f-s)//2,(f-s)//2))
              fg.save(p+'/ic_launcher_foreground.png')
          os.makedirs(res+'/mipmap-anydpi-v26',exist_ok=True)
          xml='<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n<background android:drawable="@color/ic_launcher_background"/>\n<foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          for n in ('ic_launcher','ic_launcher_round'):
              open(res+'/mipmap-anydpi-v26/'+n+'.xml','w').write(xml)
          open(res+'/values/ic_launcher_background.xml','w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n<color name="ic_launcher_background">#070B14</color>\n</resources>\n')
          PY
          ls -R android/app/src/main/res | grep ic_launcher

      - name: Add location permission
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: speedometer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
