<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#070b14"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Speedometer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css"></head><body><main>
<h1 class="brand">SPEED<span>O</span>METER</h1>
<div id="gaugeWrap"><canvas id="cv"></canvas><div id="digital"><div id="val">0</div><div id="unit">km/h</div></div></div>
<div class="tabs"><button id="ukm" class="on">km/h</button><button id="umi">mph</button><button id="hudb">HUD</button></div>
<div class="grid">
<div><small>Top speed</small><b id="mx">0</b></div>
<div><small>Average (moving)</small><b id="av">0</b></div>
<div><small>Distance</small><b id="di">0.00</b></div>
<div><small>Trip time</small><b id="tt">00:00</b></div>
<div><small>Heading</small><b id="hd">--</b></div>
<div><small>Altitude</small><b id="al">--</b></div>
<div style="grid-column:span 2"><small id="azl">0-100 km/h (stop, then floor it)</small><b id="az">--</b></div></div>
<div class="ctl"><span>Speed limit alert</span><button id="lm">−</button><b id="lv">100</b><button id="lp">+</button></div>
<div class="row2"><button id="snd" style="background:var(--card);color:var(--ink)">Alert: On</button><button id="thm" style="background:var(--card);color:var(--ink)">Theme: Cyan</button></div>
<div class="row2"><button id="go">Start GPS</button><button id="rs">Reset trip</button><button id="sv">Save trip</button></div>
<div id="st">Press Start GPS and allow location.</div>
<div id="hist"></div>
</main>
<script src="script.js"></script></body></html>
